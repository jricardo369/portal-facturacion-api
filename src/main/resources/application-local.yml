spring:
  config:
    # Toda la conexión vive en el archivo externo (misma estructura que el ejemplo
    # configuracion-general.example.yml). Opcional para no romper el arranque sin él,
    # pero sin datasource/url la app falla con mensaje claro.
    import: optional:file:/Users/joser.vazquez/config-apps/portal-facturacion-configs/configuracion-general.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# app.* (jwt, cors, fudo, correo) y spring.datasource.url/username/password
# vienen del archivo externo (ver spring.config.import arriba).

management:
  endpoint:
    health:
      show-details: always
