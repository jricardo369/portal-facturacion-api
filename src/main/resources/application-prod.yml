spring:
  config:
    # Requerido: toda la conexión (datasource, jwt, cors, correo, fudo) vive en este
    # archivo externo. Sin él la app falla rápido en vez de arrancar contra otra BD.
    import: file:/opt/portal-facturacion-configs/configuracion-general.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# app.* (jwt, cors, fudo, correo) y spring.datasource.url/username/password
# vienen del archivo externo (ver spring.config.import arriba).

management:
  endpoint:
    health:
      show-details: when-authorized
