spring:
  config:
    import: optional:file:/opt/tomcat/assets/configuracion-general.yml
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
    issuer: ${JWT_ISSUER:portal-facturacion}
    audience: ${JWT_AUDIENCE:portal-facturacion-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  correo:
    ruta-layouts: ${CORREO_RUTA_LAYOUTS:/opt/tomcat/assets}
    ruta-logo: ${CORREO_RUTA_LOGO:}

management:
  endpoint:
    health:
      show-details: when-authorized
