spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-secret-key-with-at-least-32-chars-0123456789!!
    expiration-ms: 600000
    issuer: portal-facturacion-test
    audience: portal-facturacion-api-test
  cors:
    allowed-origins: http://localhost:3000
