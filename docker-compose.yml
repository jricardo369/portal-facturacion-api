services:
  api:
    build: .
    container_name: portal-facturacion-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Toda la conexión (BD, JWT, correo, FuDo) vive en este archivo externo.
      # Copiar configuracion-general.example.yml -> configuracion-general.yml y rellenar.
      - ./configuracion-general.yml:/opt/portal-facturacion-configs/configuracion-general.yml:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
