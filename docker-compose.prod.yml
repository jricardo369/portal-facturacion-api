services:
  api:
    image: ghcr.io/${IMAGE_OWNER:-tu-organizacion}/portal-facturacion-api:${TAG:-latest}
    container_name: portal-facturacion-api
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    volumes:
      # Toda la conexión vive aquí. En el servidor debe existir
      # /opt/portal-facturacion-configs/configuracion-general.yml (chmod 600, no versionado).
      - /opt/portal-facturacion-configs/configuracion-general.yml:/opt/portal-facturacion-configs/configuracion-general.yml:ro
      # Layouts de correo (editables en el servidor sin rebuild).
      # En el servidor debe existir /opt/portal-facturacion-configs/html-mails/correo_factura.html
      # con archivos 644 y directorios 755 para que el usuario 'app' del contenedor pueda leerlos.
      - /opt/portal-facturacion-configs/html-mails:/opt/portal-facturacion-configs/html-mails:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # Grep a '"status":"UP"': wget sale 0 aunque el JSON sea {"status":"DOWN"}.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  web:
    image: ghcr.io/${WEB_IMAGE_OWNER:-tu-organizacion}/portal-facturacion-web:${WEB_TAG:-latest}
    container_name: portal-facturacion-web
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-api.tudominio.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
