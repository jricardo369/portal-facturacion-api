services:
  api:
    image: ghcr.io/${IMAGE_OWNER:-tu-organizacion}/portal-facturacion-api:${TAG:-latest}
    container_name: portal-facturacion-api
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    volumes:
      # Toda la conexión vive aquí. En el servidor debe existir
      # /opt/portal-facturacion-configs/configuracion-general.yml (chmod 600, no versionado).
      - /opt/portal-facturacion-configs/configuracion-general.yml:/opt/portal-facturacion-configs/configuracion-general.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    image: ghcr.io/${WEB_IMAGE_OWNER:-tu-organizacion}/portal-facturacion-web:${WEB_TAG:-latest}
    container_name: portal-facturacion-web
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-api.tudominio.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
